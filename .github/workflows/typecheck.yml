name: Typkontroll
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: bash setup.sh > setup.log 2>&1 || true
      - run: |
          mkdir -p ci
          (npx tsc --noEmit > ci/tsc.txt 2>&1; echo "TSC_RC=$?" >> ci/tsc.txt) || true
          (npm audit --omit=dev > ci/audit.txt 2>&1; echo "AUDIT_RC=$?" >> ci/audit.txt) || true
          tail -40 setup.log > ci/setup-tail.txt
          git config user.name "wicki-ci"; git config user.email "actions@users.noreply.github.com"
          git add -f ci; git commit -m "Typkontroll ${GITHUB_SHA::7}" || true
          git push origin HEAD:ci-out --force
