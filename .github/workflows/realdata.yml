name: Riktiga marknadsdata
on:
  workflow_dispatch:
  push:
    branches: [data-refresh]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/realdata.py
      - run: |
          git config user.name "wicki-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/real.ts
          git commit -m "Uppdatera riktiga marknadsdata" || echo "inga ändringar"
          git push origin HEAD:data-refresh-out --force
